<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

   <script>
    let studentIndex = -1;

    window.onload = function () {
        event.preventDefault();
        const urlParams = new URLSearchParams(window.location.search);
        const roll = urlParams.get("roll");

        const students = JSON.parse(localStorage.getItem("students")) || [];

        for (let i = 0; i < students.length; i++) {
            if (students[i].roll === roll) {
                studentIndex = i;

                document.getElementById("name").value = students[i].name;
                document.getElementById("roll").value = students[i].roll;
                document.getElementById("cgpa").value = students[i].cgpa;
                document.getElementById("branch").value = students[i].branch;

                break;
            }
        }

        if (studentIndex === -1) {
            alert("Student not found!");
            window.location.href = "view-students.html";
        }
    };

    function updateStudent(event) {
        event.preventDefault();
        const students = JSON.parse(localStorage.getItem("students")) || [];
        const newRoll = document.getElementById("roll").value;
        for (let i = 0; i < students.length; i++) {
            if (students[i].roll === newRoll && i !== studentIndex) {
                alert("Student with this roll number already exists!");
                return;
            }
        }

        students[studentIndex] = {
            name: document.getElementById("name").value,
            roll: newRoll,
            cgpa: document.getElementById("cgpa").value,
            branch: document.getElementById("branch").value
        };

        localStorage.setItem("students", JSON.stringify(students));

        alert("Student updated successfully!");

        window.location.href = "view-students.html";
    }
</script>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    
    <nav>
        <a href = "dashboard.html">Dashboard</a>  |
        <a href = "view-students.html">View Students</a> |
        <a href = "logout.html">Logout</a>
    </nav>
    <h1>Edit Student</h1>
    <form onsubmit="updateStudent(event)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="roll">Roll Number :</label>
        <input type="text" id="roll" name="roll" required><br><br>

        <label for="cgpa">CGPA :</label>
        <input type="number" id="cgpa" name="cgpa" min="0" max="10" step="0.01" required><br><br>
        
        <label for= "branch">Branch :</label>
        <input type="text" id="branch" name="branch" required><br><br>

        <button type="submit">Update Student</button>
    </form>

     <footer>
        <b>&copy; 2026 Student Management System. All rights reserved.</b>
    </footer>
</body>
</html>
