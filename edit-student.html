<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

    <script>
        window.onload = function () {
            var urlParams = new URLSearchParams(window.location.search);
            var roll = urlParams.get("roll");

            var students = JSON.parse(localStorage.getItem("students")) || [];
            var student = students.find(function (student) {
                return student.roll === roll;
            });

            if (student) {
                document.getElementById("name").value = student.name;
                document.getElementById("roll").value = student.roll;
                document.getElementById("cgpa").value = student.cgpa;
                document.getElementById("branch").value = student.branch;
            }
        }

    </script>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    
    <nav>
        <a href = "dashboard.html">Dashboard</a>  |
        <a href = "view-students.html">View Students</a> |
        <a href = "logout.html">Logout</a>
    </nav>
    <h1>Edit Student</h1>
    <form action="view-students.html" method="get">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="roll">Roll Number :</label>
        <input type="text" id="roll" name="roll" required><br><br>

        <label for="cgpa">CGPA :</label>
        <input type="number" id="cgpa" name="cgpa" min="0" max="10" step="0.01" required><br><br>
        
        <label for= "branch">Branch :</label>
        <input type="text" id="branch" name="branch" required><br><br>

        <button type="submit">Update Student</button>
    </form>

     <footer>
        <b>&copy; 2026 Student Management System. All rights reserved.</b>
    </footer>
</body>
</html>
