<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script>
        function storeData(event) {
            var username = document.getElementById("username").value;
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var confirmPass = document.getElementById("confirmPass").value;
            
            if(validateForm(username , email , password , confirmPass) === false) return false;

            var data = {
                username: username,
                email: email,
                password: password
            };

            localStorage.setItem("user" , JSON.stringify(data));
            event.preventDefault();
            window.location.href = "login.html";
            
        }
        function validateForm(username , email , password , confirmPass) {
            event.preventDefault();
             var userExp = /^[A-Za-z][A-Za-z0-9]{8,}/;
            if(!userExp.test(username)){
                alert("Invalid username");
                return false;
            }
            
            var passwordExp = /[a-zA-Z0-9]{9,}/;
            if(!passwordExp.test(password)){
                alert("Invalid password");
                return false;
            }
            
            


            if(password !== confirmPass) {
                alert("Passwords do not match");
                return false;
            }
            return true;
        }
    </script>
    
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <nav>
        <a href = "index.html">Home</a>  |
        <a href = "login.html">Login</a> |
        <a href = "register.html">Register</a>

    </nav>
    <h1>Register </h1>
    <form onsubmit = "storeData(event)">
        <label for = "username">Username : </label>
        <input id = "username" type = "text" name = "username" required>
        <br>
        <br>
        
        <label for = "email" >Email : </label>
        <input type = "email" id = "email" name = "email" required>
        <br><br>
         <label for = "password">Password : </label>
        <input id = "password" type = "password" name  = "password" required>

        <br><br>

        <label for = "confirmPass"> Confirm Password : </label>
        <input id = "confirmPass" type = "password" name  = "confirmPass" required>
        <br>
        <br>
        <button type = "submit" >Submit</button>
    </form>
    <br><br>

    <div>
        <p> <b>Already have an account ? </b><a href = "login.html">Login Here </a></p>
    </div>

   
</body>

</html>
