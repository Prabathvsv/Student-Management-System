<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script>

        function validateForm(event) {
            event.preventDefault();
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            
            var userExp = /^[A-Za-z][A-Za-z0-9]{8,}/;
            if(!userExp.test(username)){
                alert("Invalid username");
                return false;
            }

             var passwordExp = /[a-zA-Z0-9]{9,}/;
            if(!passwordExp.test(password)){
                alert("Invalid password");
                return false;
            }
            var storedData = JSON.parse(localStorage.getItem("user"));
            if(storedData && storedData.username === username && storedData.password === password) {
                alert("Login Successful");
                window.location.href = "dashboard.html";
            }

            else{
                alert("Invalid Credentials");
                return;
            }
        }
    </script>
    <nav>
        <a href = "index.html">Home</a>  |
        <a href = "login.html">Login</a> |
        <a href = "register.html">Register</a>

    </nav>

    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h1>Login</h1>
    <form  onsubmit = "return validateForm(event)">
        <label for = "username">Username : </label>
        <input id = "username" type = "text" name = "username" required>
        <br>
        <br>
         <label for = "password">Password : </label>
        <input id = "password" type = "password" name  = "password" required>
        <br><br>
        <button type = "submit">Submit</button>
    </form>
    <br><br>
    <div>
        <p> <b>New User ?</b> <a href = "register.html">Register here</a></p>
    </div>
     <footer>
        <p>&copy; 2026 Student Management System. All rights reserved.</p>
    </footer>

    
</body>
</html>
