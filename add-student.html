<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <script>
        function validateForm(event) {
            event.preventDefault();
            var name = document.getElementById("name").value;
            var roll = document.getElementById("roll").value;
            var cgpa = document.getElementById("cgpa").value;
            var branch = document.getElementById("branch").value;

              
            var students = JSON.parse(localStorage.getItem("students")) || [];
            students.push({
                name: name,
                roll: roll,
                cgpa: cgpa,
                branch: branch
            });
            localStorage.setItem("students", JSON.stringify(students));
            alert("Student added successfully!");
            window.location.href = "view-students.html";
            return true;
        }
    </script>
    <nav>
        <a href = "dashboard.html">Dashboard</a>  |
        <a href = "view-students.html">View Students</a> |
        <a href = "logout.html">Logout</a>
    </nav>
    
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h1>Add Student</h1>
    <form onsubmit="return validateForm(event)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="roll">Roll Number :</label>
        <input type="text" id="roll" name="roll" required><br><br>

        <label for="cgpa">CGPA :</label>
        <input type="number" id="cgpa" name="cgpa" min="0" max="10" step="0.01" required><br><br>

        <label for = "branch">Branch :</label>
        <select id="branch" name="branch" required>
            <option value="">Select Branch</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="ME">ME</option>
            <option value="CE">CE</option>
            <option value="EE">EE</option>
        </select><br><br>
        <button type="submit">Add Student</button>
    </form>

    <footer>
        <b>&copy; 2026 Student Management System. All rights reserved.</b>
    </footer>
</body>
</html>
